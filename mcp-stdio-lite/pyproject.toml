[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-stdio-lite"
version = "0.1.0"
description = "Minimal MCP stdio server: pure-stdlib JSON-RPC 2.0 over stdin/stdout"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Brook Zeng" }]
classifiers = [
    "Framework :: LLM",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/BrookZeng2023/py-toolbox"
